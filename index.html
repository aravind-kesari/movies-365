<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="Explore Movies 365. Browse your movie collection, search titles and discover movies by language.">
<meta name="robots" content="index, follow">
<title>Movies 365 | Movie Collection</title>

<style>
:root {
    --bg: #080808;
    --card: #151515;
    --accent: #f5c518;
    --text: #ffffff;
    --muted: #aaaaaa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    padding: 17px 5%;
    background: #101010;
    border-bottom: 1px solid #262626;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    white-space: nowrap;
}

.logo span {
    color: white;
}

.search-box {
    width: min(380px, 100%);
    padding: 12px 15px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #1c1c1c;
    color: white;
    font-size: 15px;
    outline: none;
}

.search-box:focus {
    border-color: var(--accent);
}

.hero {
    min-height: 330px;
    padding: 55px 6%;
    display: flex;
    align-items: center;
    background:
        linear-gradient(90deg, #080808 5%, rgba(8,8,8,.82) 55%, rgba(8,8,8,.2)),
        linear-gradient(0deg, #080808, transparent 65%),
        radial-gradient(ellipse at 75% 35%, #671818, #241010 45%, #080808 80%);
}

.hero-content {
    max-width: 680px;
}

.badge {
    display: inline-block;
    padding: 7px 11px;
    margin-bottom: 16px;
    background: var(--accent);
    color: #111;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(34px, 6vw, 58px);
    line-height: 1.12;
    overflow-wrap: anywhere;
    margin-bottom: 15px;
}

.hero p {
    color: #ddd;
    line-height: 1.7;
    margin-bottom: 22px;
}

.primary-btn {
    display: inline-block;
    padding: 13px 20px;
    border: 0;
    border-radius: 5px;
    background: var(--accent);
    color: #111;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.primary-btn:hover,
.download-btn:hover {
    background: #ffdc50;
}

main {
    padding: 25px 5%;
    min-height: 350px;
}

.section-title {
    font-size: 25px;
    margin: 15px 0 20px;
}

.filters {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.filter-btn {
    padding: 9px 15px;
    border: 1px solid #444;
    border-radius: 22px;
    background: #202020;
    color: white;
    cursor: pointer;
}

.filter-btn.active,
.filter-btn:hover {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
}

.status {
    color: var(--muted);
    padding: 18px 0;
    line-height: 1.7;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 22px 15px;
}

.movie-card {
    min-width: 0;
    overflow: hidden;
    border-radius: 8px;
    background: var(--card);
    transition: transform .2s, box-shadow .2s;
}

.movie-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,.7);
}

.poster {
    height: 235px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(145deg, #451515, #171717 70%);
}

.poster img {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    object-fit: cover;
}

.poster-icon {
    font-size: 48px;
    opacity: .8;
}

.poster-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: 28px 8px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.9));
    font-size: 11px;
    font-weight: bold;
}

.movie-info {
    padding: 12px;
}

.movie-info h3 {
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

.language {
    display: block;
    color: var(--accent);
    font-size: 11px;
    margin-bottom: 12px;
}

.download-btn {
    display: block;
    width: 100%;
    padding: 11px 5px;
    border-radius: 5px;
    background: var(--accent);
    color: #111;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

footer {
    margin-top: 35px;
    padding: 30px 15px;
    border-top: 1px solid #222;
    color: #888;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
}

@media (max-width: 500px) {
    header {
        padding: 15px 4%;
    }

    .logo {
        font-size: 24px;
    }

    .search-box {
        width: 100%;
    }

    .hero {
        min-height: 270px;
        padding: 40px 5%;
    }

    main {
        padding: 20px 4%;
    }

    .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 10px;
    }

    .poster {
        height: 210px;
    }
}
</style>

</head>

<body>

<header>
    <div class="logo">MOVIES <span>365</span></div>

```
<input
    id="searchInput"
    class="search-box"
    type="search"
    placeholder="Search movies..."
    aria-label="Search movies"
>
```

</header>

<section class="hero">
    <div class="hero-content">
        <div class="badge">WELCOME TO MOVIES 365</div>
        <h1 id="heroTitle">Discover Your Next Favourite</h1>
        <p>Explore your movie collection in one place. Search titles and browse by language.</p>

```
    <button class="primary-btn" id="exploreBtn" type="button">
        🎬 Explore Collection
    </button>
</div>
```

</section>

<main id="movies">
    <h2 class="section-title">Explore Movies</h2>

```
<div class="filters">
    <button class="filter-btn active" data-language="All">All</button>
    <button class="filter-btn" data-language="Telugu">Telugu</button>
    <button class="filter-btn" data-language="Tamil">Tamil</button>
    <button class="filter-btn" data-language="Hindi">Hindi</button>
    <button class="filter-btn" data-language="Malayalam">Malayalam</button>
    <button class="filter-btn" data-language="Kannada">Kannada</button>
    <button class="filter-btn" data-language="English">English</button>
    <button class="filter-btn" data-language="Other">Other</button>
</div>

<p id="status" class="status" role="status" aria-live="polite">
    Loading your collection...
</p>

<div id="movieGrid" class="movie-grid"></div>
```

</main>

<footer>
    <p>© <span id="year"></span> Movies 365 | Your Movie Collection</p>
</footer>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbzCMpd3eJeMRyIuplSiqLFS1g69_sWwMHm3z11QsqAJIQ2I37wlkGTW3n-ZeAKzAKba0g/exec";

const grid = document.getElementById("movieGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const heroTitle = document.getElementById("heroTitle");

let allMovies = [];
let activeLanguage = "All";

document.getElementById("year").textContent = new Date().getFullYear();

document.getElementById("exploreBtn").addEventListener("click", function () {
    document.getElementById("movies").scrollIntoView({ behavior: "smooth" });
});

function getLanguage(name) {
    const text = String(name || "").toLowerCase();

    if (/\b(telugu|tlg)\b/.test(text)) return "Telugu";
    if (/\b(tamil|tam)\b/.test(text)) return "Tamil";
    if (/\b(hindi|hin)\b/.test(text)) return "Hindi";
    if (/\b(malayalam|mal)\b/.test(text)) return "Malayalam";
    if (/\b(kannada|kan)\b/.test(text)) return "Kannada";
    if (/\b(english|eng)\b/.test(text)) return "English";

    return "Other";
}

function cleanTitle(name) {
    return String(name || "")
        .replace(/\.[^/.]+$/, "")
        .replace(/[._]+/g, " ")
        .replace(/\b(480p|720p|1080p|2160p|4k|8k|web.?dl|webrip|bluray|hdrip|x264|x265|hevc|h264|h265)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function createMovieCard(movie) {
    const card = document.createElement("article");
    card.className = "movie-card";

    const poster = document.createElement("div");
    poster.className = "poster";

    const icon = document.createElement("div");
    icon.className = "poster-icon";
    icon.textContent = "🎬";
    poster.appendChild(icon);

    const img = document.createElement("img");
    img.alt = (movie.title || "Movie") + " poster";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";

    const driveThumbnail =
        "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(movie.id) + "&sz=w500";

    img.onload = function () {
        if (img.naturalWidth > 0) {
            icon.style.display = "none";
        }
    };

    img.onerror = function () {
        if (!img.dataset.fallback && img.src !== driveThumbnail) {
            img.dataset.fallback = "used";
            img.src = driveThumbnail;
        } else {
            img.remove();
            icon.style.display = "block";
        }
    };

    img.src = movie.posterUrl || driveThumbnail;
    poster.appendChild(img);

    const label = document.createElement("div");
    label.className = "poster-label";
    label.textContent =
        movie.language === "Other" ? "MOVIES 365" : movie.language.toUpperCase();

    poster.appendChild(label);

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("h3");
    title.textContent = movie.title || cleanTitle(movie.name);

    const language = document.createElement("div");
    language.className = "language";
    language.textContent = movie.language === "Other" ? "Video" : movie.language;

    if (movie.year) {
        language.textContent += " • " + movie.year;
    }

    const download = document.createElement("a");
    download.className = "download-btn";
    download.textContent = "⬇ Download";
    download.href =
        "https://drive.google.com/uc?export=download&id=" +
        encodeURIComponent(movie.id);
    download.target = "_blank";
    download.rel = "noopener noreferrer";
    download.setAttribute("aria-label", "Open download for " + (movie.title || movie.name));

    /*
      Google Drive may show a confirmation page for large files.
      If direct download is blocked, the button falls back to the Drive file page.
    */
    download.addEventListener("click", function () {
        download.href =
            "https://drive.google.com/file/d/" +
            encodeURIComponent(movie.id) + "/view";
    });

    info.appendChild(title);
    info.appendChild(language);
    info.appendChild(download);

    card.appendChild(poster);
    card.appendChild(info);

    return card;
}

function renderMovies() {
    const query = searchInput.value.toLowerCase().trim();

    const filtered = allMovies.filter(function (movie) {
        const searchableText =
            (movie.name + " " + movie.title + " " + movie.year).toLowerCase();

        const matchesSearch = searchableText.includes(query);
        const matchesLanguage =
            activeLanguage === "All" || movie.language === activeLanguage;

        return matchesSearch && matchesLanguage;
    });

    grid.innerHTML = "";

    if (filtered.length === 0) {
        statusText.textContent = allMovies.length
            ? "No matching movies found."
            : "No videos found in your collection.";

        return;
    }

    statusText.textContent = filtered.length + " video(s) in your collection";

    const fragment = document.createDocumentFragment();

    filtered.forEach(function (movie) {
        fragment.appendChild(createMovieCard(movie));
    });

    grid.appendChild(fragment);

    heroTitle.textContent =
        filtered[0].title || cleanTitle(filtered[0].name);
}

async function loadMovies() {
    statusText.textContent = "Loading your collection...";

    try {
        const response = await fetch(API_URL, { cache: "no-store" });

        if (!response.ok) {
            throw new Error("Server returned HTTP " + response.status);
        }

        const data = await response.json();

        if (data && data.success === false) {
            throw new Error(data.error || "The movie service returned an error.");
        }

        const files = Array.isArray(data)
            ? data
            : (data.files || data.movies || []);

        if (!Array.isArray(files)) {
            throw new Error("Unexpected response format from movie service.");
        }

        allMovies = files
            .filter(function (file) {
                return file && file.id && file.name;
            })
            .filter(function (file) {
                const mime = file.mimeType || "";
                return mime.startsWith("video/") ||
                    /\.(mp4|mkv|mov|webm|avi|m4v)$/i.test(file.name);
            })
            .map(function (file) {
                return {
                    id: file.id,
                    name: file.name,
                    title: file.title || cleanTitle(file.name),
                    year: file.year || "",
                    posterUrl: file.posterUrl || "",
                    language: getLanguage(file.name)
                };
            });

        renderMovies();

    } catch (error) {
        statusText.textContent =
            "Could not load videos. Please refresh the page and try again.";

        console.error("Movies 365 loading error:", error);
    }
}

searchInput.addEventListener("input", renderMovies);

document.querySelectorAll(".filter-btn").forEach(function (button) {
    button.addEventListener("click", function () {
        document.querySelectorAll(".filter-btn").forEach(function (btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        activeLanguage = button.dataset.language;
        renderMovies();
    });
});

loadMovies();
</script>

</body>
</html>
