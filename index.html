<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzGwnAFDvwgMTEKhCDqNcDcvAVXDwnJs6OTrhcaMH1fulOGSKtk5hYT8Fa-LitBbCElzw/exec";

let movies = [];
let selectedLanguage = "All";

const movieContainer = document.getElementById("movies");
const searchInput = document.getElementById("search");
const emptyMessage = document.getElementById("empty");

function getLanguage(name) {
  const text = name.toLowerCase();

  if (text.includes("telugu")) return "Telugu";
  if (text.includes("tamil")) return "Tamil";
  if (text.includes("hindi")) return "Hindi";
  if (text.includes("malayalam")) return "Malayalam";
  if (text.includes("kannada")) return "Kannada";
  if (text.includes("english")) return "English";

  return "Other";
}

function renderMovies() {
  const query = searchInput.value.trim().toLowerCase();

  const filtered = movies.filter(movie =>
    (selectedLanguage === "All" ||
     movie.language === selectedLanguage) &&
    movie.title.toLowerCase().includes(query)
  );

  movieContainer.innerHTML = "";
  emptyMessage.hidden = filtered.length !== 0;

  filtered.forEach(movie => {
    const card = document.createElement("article");
    card.className = "card";

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.textContent = "🎬";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h3");
    title.textContent = movie.title;

    const details = document.createElement("p");
    details.textContent = movie.language;

    const link = document.createElement("a");
    link.href = movie.download;
    link.textContent = "Open Video";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    info.append(title, details, link);
    card.append(poster, info);
    movieContainer.appendChild(card);
  });
}
