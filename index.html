<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzuTq7UryC5MDyHgffrtonlkmi_xMSgsgxEKeJtL0FqETwiP9x2RGTFMsMAI7up5XuiOQ/exec";

const grid = document.getElementById("movieGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

let allMovies = [];
let activeLanguage = "All";

document.getElementById("year").textContent = new Date().getFullYear();

function getLanguage(name) {
    const text = name.toLowerCase();

    if (/\b(telugu|tlg)\b/.test(text)) return "Telugu";
    if (/\b(tamil|tam)\b/.test(text)) return "Tamil";
    if (/\b(hindi|hin)\b/.test(text)) return "Hindi";
    if (/\b(malayalam|mal)\b/.test(text)) return "Malayalam";
    if (/\b(kannada|kan)\b/.test(text)) return "Kannada";
    if (/\b(english|eng)\b/.test(text)) return "English";

    return "Other";
}

function cleanTitle(name) {
    return name
        .replace(/\.[^/.]+$/, "")
        .replace(/[._]+/g, " ")
        .replace(/\b(480p|720p|1080p|2160p|4k|8k|web.?dl|webrip|bluray|hdrip|x264|x265|hevc|h264|h265)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function renderMovies() {
    const query = searchInput.value.toLowerCase().trim();

    const filtered = allMovies.filter(movie => {
        const searchableText = `${movie.name} ${movie.title} ${movie.year}`.toLowerCase();
        const matchesSearch = searchableText.includes(query);
        const matchesLanguage =
            activeLanguage === "All" ||
            movie.language === activeLanguage;

        return matchesSearch && matchesLanguage;
    });

    grid.innerHTML = "";

    if (filtered.length === 0) {
        statusText.textContent = allMovies.length
            ? "No matching movies found."
            : "No videos found in your collection.";

        return;
    }

    statusText.textContent = `${filtered.length} video(s) in your collection`;

    filtered.forEach(movie => {
        const card = document.createElement("article");
        card.className = "movie-card";

        const poster = document.createElement("div");
        poster.className = "poster";

        const icon = document.createElement("div");
        icon.className = "poster-icon";
        icon.textContent = "🎬";
        poster.appendChild(icon);

        const img = document.createElement("img");
        img.alt = `${movie.title} poster`;
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        // Use the movie poster returned by Apps Script/OMDb first.
        // If unavailable, try the Google Drive thumbnail.
        const driveThumbnail =
            `https://drive.google.com/thumbnail?id=${encodeURIComponent(movie.id)}&sz=w500`;

        img.onerror = function () {
            if (this.dataset.fallback !== "used" &&
                this.src !== driveThumbnail) {
                this.dataset.fallback = "used";
                this.src = driveThumbnail;
            } else {
                this.remove();
            }
        };

        img.onload = function () {
            if (this.naturalWidth > 0) {
                icon.style.display = "none";
            }
        };

async function loadMovies() {
    statusText.textContent = "Loading your collection...";

    try {
        const response = await fetch(API_URL, { cache: "no-store" });

        if (!response.ok) {
            throw new Error("Could not connect to the movie collection.");
        }

        const data = await response.json();

        if (data.success === false) {
            throw new Error(data.error || "The movie service returned an error.");
        }

        const files = Array.isArray(data)
            ? data
            : (data.files || data.movies || []);

        allMovies = files
            .filter(file => file.id && file.name)
            .filter(file => {
                const mime = file.mimeType || "";
                return mime.startsWith("video/") ||
                       /\.(mp4|mkv|mov|webm|avi|m4v)$/i.test(file.name);
            })
            .map(file => ({
                id: file.id,
                name: file.name,
                title: file.title || cleanTitle(file.name),
                year: file.year || "",
                posterUrl: file.posterUrl || "",
                language: getLanguage(file.name)
            }));

        renderMovies();

    } catch (error) {
        statusText.textContent =
            "Could not load videos. Please refresh the page and try again.";

        console.error("Movies 365 loading error:", error);
    }
}

searchInput.addEventListener("input", renderMovies);

document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        activeLanguage = button.dataset.language;
        renderMovies();
    });
});

loadMovies();
</script>
